<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指尖水膜折射 | 希彼赫同款</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh;object-fit:cover}
#ui{position:fixed;top:12px;right:12px;color:#fff;font-family:system-ui;font-size:14px;background:rgba(0,0,0,0.4);padding:8px 12px;border-radius:8px;z-index:10}
</style>
</head>
<body>
<div id="ui">正在加载手势模型...</div>
<canvas id="glCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl');
const ui = document.getElementById('ui');
let w, h;

// Shader：核心就是【骨骼连线水膜、细轮廓高光、弱色散】
const vs = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){
  v_uv = a_pos*0.5+0.5;
  gl_Position = vec4(a_pos,0.,1.);
}`;
const fs = `
precision highp float;
uniform sampler2D u_cam;
uniform vec2 u_res;
uniform vec4 u_lines[48]; // 线段: x1,y1,x2,y2
uniform int u_lineCount;
varying vec2 v_uv;

float sdLine(vec2 p, vec2 a, vec2 b){
  vec2 pa = p-a, ba = b-a;
  float h = clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
  return length(pa - ba*h);
}

void main(){
  vec2 uv = v_uv;
  vec2 px = 1./u_res;
  vec3 col = texture2D(u_cam, uv).rgb;
  float mask = 0.;
  float rim = 0.;

  for(int i=0;i<48;i++){
    if(i>=u_lineCount)break;
    vec4 seg = u_lines[i];
    vec2 a = seg.xy;
    vec2 b = seg.zw;
    float d = sdLine(uv, a, b);
    // 水膜主体
    float water = smoothstep(0.045,0.012,d);
    mask += water*0.32;
    // 轮廓细高光（就是视频里那条亮边）
    float r = smoothstep(0.018,0.006,d);
    rim += r;
  }
  mask = clamp(mask,0.,1.);
  rim = clamp(rim,0.,1.);

  // 轻微折射偏移
  vec2 offset = vec2(rim*0.008, rim*0.004);
  vec3 refr = texture2D(u_cam, uv-offset).rgb;
  // 一点点红边色散，和原版一致
  vec3 colR = texture2D(u_cam, uv-offset*1.2).rgb;
  vec3 colG = texture2D(u_cam, uv-offset*0.8).rgb;
  vec3 colB = texture2D(u_cam, uv-offset*0.6).rgb;
  vec3 disp = vec3(colR.r, colG.g, colB.b);

  vec3 outCol = mix(col, disp, rim*0.22);
  outCol += vec3(1.0,0.92,0.95)*rim*0.75;
  outCol = mix(outCol, refr, mask*0.6);
  gl_FragColor = vec4(outCol,1.);
}
`;

function compile(src,type){
  const s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog,compile(vs,gl.VERTEX_SHADER));
gl.attachShader(prog,compile(fs,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

const a_pos = gl.getAttribLocation(prog,'a_pos');
const u_cam = gl.getUniformLocation(prog,'u_cam');
const u_res = gl.getUniformLocation(prog,'u_res');
const u_lines = gl.getUniformLocation(prog,'u_lines');
const u_lineCount = gl.getUniformLocation(prog,'u_lineCount');

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(a_pos);
gl.vertexAttribPointer(a_pos,2,gl.FLOAT,false,0,0);

const camTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, camTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

let lineList = [];

// MediaPipe Hands
const hands = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});
hands.onResults(res=>{
  lineList = [];
  if(res.multiHandLandmarks){
    for(const hand of res.multiHandLandmarks){
      // 手指骨骼连线（0腕骨，1-4拇指，5-8食指，9-12中指，13-16无名指，17-20小指）
      const bones = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20]
      ];
      for(const [a,b] of bones){
        const p1 = hand[a];
        const p2 = hand[b];
        // uv坐标：y翻转
        lineList.push(p1.x,1.-p1.y, p2.x,1.-p2.y);
      }
    }
  }
  ui.innerText = lineList.length>0?"手势追踪成功":"把手放到镜头前";
});

const camera = new CameraUtils.Camera(
  {video:document.createElement('video')},
  {onFrame:async(img)=>await hands.send({image:img})}
);
camera.start();

function resize(){
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w;
  canvas.height = h;
  gl.viewport(0,0,w,h);
}
resize();
window.addEventListener('resize',resize);

function draw(){
  requestAnimationFrame(draw);
  const vid = camera.video;
  if(vid && vid.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D,camTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
  }
  gl.uniform2f(u_res,w,h);
  const arr = new Float32Array(lineList);
  gl.uniform4fv(u_lines, arr);
  gl.uniform1i(u_lineCount, lineList.length/4);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
draw();
</script>
</body>
</html>
